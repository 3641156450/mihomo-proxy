<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>离线资源包</title>
<style>
  :root{--bg:#0f1115;--card:#171a21;--line:#262b35;--txt:#e6e9ef;--brand:#4f8cff}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    background:radial-gradient(1200px 600px at 50% -10%,#1b2030 0%,var(--bg) 60%);
    color:var(--txt);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:48px 40px;
    box-shadow:0 10px 30px rgba(0,0,0,.35);text-align:center;max-width:420px;width:100%}
  h1{font-size:22px;font-weight:700;margin-bottom:28px;letter-spacing:.5px}
  .dl{display:inline-flex;align-items:center;justify-content:center;gap:10px;width:100%;
    padding:16px 20px;border-radius:14px;text-decoration:none;font-size:17px;font-weight:600;color:#fff;
    background:linear-gradient(135deg,var(--brand),#6aa0ff);box-shadow:0 8px 22px rgba(79,140,255,.35);
    transition:transform .08s ease,box-shadow .2s ease}
  .dl:hover{transform:translateY(-1px);box-shadow:0 12px 28px rgba(79,140,255,.45)}
  .dl:active{transform:translateY(1px)}
</style>
</head>
<body>
<div class="card">
  <h1>离线资源包</h1>
  <a class="dl" href="offline-package.zip" download="offline-package.zip">⬇ 下载完整包</a>
</div>
</body>
</html>
